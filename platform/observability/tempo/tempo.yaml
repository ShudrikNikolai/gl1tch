services:
  # Без тома: трейсы живут до пересоздания контейнера (dev). Для постоянного хранения
  # нужен том с правами пользователя 10001 или объектное хранилище.
  tempo:
    image: grafana/tempo:${TEMPO_TAG:-2.6.1}
    profiles: [obs]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
    networks: [internal]
