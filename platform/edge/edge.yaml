volumes:
  caddy-data:
  caddy-config:

services:
  edge:
    image: caddy:${CADDY_TAG:-2-alpine}
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    networks:
      - gl1tch-shared
