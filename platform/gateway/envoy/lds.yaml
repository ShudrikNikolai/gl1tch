resources:
  - name: http
    "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: gateway
              always_set_request_id_in_response: true
              tracing:
                provider:
                  name: envoy.tracers.opentelemetry
                  typed_config:
                    "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                    grpc_service:
                      envoy_grpc: { cluster_name: otel-collector }
                      timeout: 1s
                    service_name: envoy
                random_sampling: { value: 100 }
              normalize_path: true
              merge_slashes: true
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              route_config:
                name: gateway
                virtual_hosts:
                  - name: gateway
                    domains: ["*"]
                    routes:
                      # Маршрут выбирается ПОСЛЕ транскодинга, по gRPC-пути
                      - match: { prefix: "/auth.v1.AuthService/" }
                        route: { cluster: auth-grpc, timeout: 3s }
                        request_headers_to_add: # устанавливаем куку
                          - header: { key: x-token-transport, value: cookie }
                            append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      - match: { prefix: "/auth.v1.UserService/" }
                        route: { cluster: users-grpc, timeout: 3s }
              http_filters:
                - name: envoy.filters.http.jwt_authn
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                    providers:
                      auth:
                        remote_jwks:
                          http_uri:
                            uri: http://auth:8080/.well-known/jwks.json
                            cluster: auth-http
                            timeout: 2s
                          cache_duration: 600s
                        # issuer / audiences добавь, если auth их проставляет в токены
                        claim_to_headers:
                          - { header_name: x-user-id, claim_name: sub }
                          - { header_name: x-roles, claim_name: role }
                          - { header_name: x-roles, claim_name: roles_csv }
                        payload_in_metadata: jwt_payload
                    rules:
                      # публичные: регистрация, логин, refresh, logout
                      - match: { prefix: "/auth/" }
                      # всё остальное только с валидным JWT
                      - match: { prefix: "/" }
                        requires: { provider_name: auth }
                - name: envoy.filters.http.rbac
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                    rules:
                      action: DENY
                      policies:
                        # прямые gRPC-вызовы снаружи запрещены, только REST через транскодер
                        no-direct-grpc:
                          permissions:
                            - url_path: { path: { prefix: "/auth.v1." } }
                          principals:
                            - any: true
                        # /admin/* только для role=admin
                        admin-only:
                          permissions:
                            - url_path: { path: { prefix: "/admin" } }
                          principals:
                            - not_id:
                                sourced_metadata:
                                  metadata_matcher:
                                    filter: envoy.filters.http.jwt_authn
                                    path: [ { key: jwt_payload }, { key: roles } ]
                                    value: { list_match: { one_of: { string_match: { exact: admin } } } }
                - name: envoy.filters.http.grpc_json_transcoder
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                    proto_descriptor: /etc/envoy/api.binpb
                    services: [auth.v1.AuthService, auth.v1.UserService]
                    convert_grpc_status: true
                    print_options:
                      preserve_proto_field_names: true
                      always_print_primitive_fields: true
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router