version: 3

vars:
  PROTO: proto

includes:
  apps:
    taskfile: ./apps/Taskfile.yaml
    dir: ./apps
  platform:
    taskfile: ./platform/Taskfile.yaml
    dir: ./platform

tasks:
  default:
    cmd: task --list

  proto:lint:
    desc: линтовка proto файлов
    cmd: "cd proto && buf lint"

  proto:build:
    desc: билд в shared proto контрактов
    deps:
      - proto:lint
    cmd: "cd proto && buf generate"
