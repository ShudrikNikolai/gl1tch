syntax = "proto3";

package events.v1;

import "google/protobuf/timestamp.proto";

// PostCreated публикуется boards после успешного создания поста.
message PostCreated {
  string event_id = 1;
  string post_id = 2;
  string thread_id = 3;
  string board_id = 4;
  string thread_title = 5;

  string author_user_id = 6;
  string author_name = 7;

  int32 post_number = 8;
  google.protobuf.Timestamp created_at = 9;
}
