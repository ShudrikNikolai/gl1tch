syntax = "proto3";

package users.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "common/v1/common.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = { get: "/users" };
  }
  rpc Me(MeRequest) returns (MeResponse) {
    option (google.api.http) = { get: "/users/me" };
  }
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = { get: "/users/{user_id}" };
  }
}

message CreateUserResponse {
  User user = 1;
}
message CreateUserRequest {
  string user_id = 1;
  string username = 2;
}

message MeResponse {
  User user = 1;
}
message MeRequest {}

message GetUserRequest {
  string user_id = 1;
}
message GetUserResponse {
  User user = 1;
}

message ListUsersRequest {
  common.v1.CursorPaginationRequest cursor = 1;
}
message ListUsersResponse {
  repeated User users = 1;
  common.v1.CursorPaginationResponse cursor = 2;
}

message User {
  string user_id = 1;
  string username = 2;
  string bio = 3;

  common.v1.Role role = 4;
  common.v1.UserStatus status = 5;
  common.v1.Gender gender = 6;

  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp deleted_at = 14;
  google.protobuf.Timestamp banned_until = 15;
}