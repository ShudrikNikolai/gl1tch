version: v2

managed:
  enabled: true
  disable:
    # иначе managed mode перепишет go_package у googleapis и сломает импорты
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/ShudrikNikolai/gl1tch/backend/shared/proto/api

plugins:
  # Go - типы сообщений
  - local: protoc-gen-go
    out: ../backend/shared/proto/api
    opt:
      - paths=source_relative

  # Go - gRPC stubs
  - local: protoc-gen-go-grpc
    out: ../backend/shared/proto/api
    opt:
      - paths=source_relative