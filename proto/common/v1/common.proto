syntax = "proto3";

package common.v1;

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_MODERATOR = 2;
  ROLE_ADMIN = 3;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_BANNED = 2;
  USER_STATUS_DELETED = 3;
  USER_STATUS_PENDING = 4;
}

enum Order {
  ORDER_UNSPECIFIED = 0;
  ORDER_ASC = 1;
  ORDER_DESC = 2;
}

enum PageSize {
  PAGE_SIZE_UNSPECIFIED = 0;
  PAGE_SIZE_20 = 20;
  PAGE_SIZE_100 = 100;
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

message CursorPaginationRequest {
  int32 page_size = 1;    // 0 = значение по умолчанию на сервере, сверху ограничено сервером
  string page_token = 2;  // пусто = первая страница
}

message CursorPaginationResponse {
  string next_page_token = 1;  // пусто = страниц больше нет
  bool has_more = 2;
}