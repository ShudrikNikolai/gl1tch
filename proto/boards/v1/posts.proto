syntax = "proto3";

package boards.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "boards/v1/common.proto";
import "common/v1/common.proto";
import "google/protobuf/empty.proto";

service PostService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse) {
    option (google.api.http) = { post: "/v1/posts" body: "*" };
  };
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse) {
    option (google.api.http) = { get: "/v1/posts" };
  };
  rpc GetPost(GetPostRequest) returns (GetPostResponse) {
    option (google.api.http) = { get: "/v1/posts/{post_id}" };
  };
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse) {
    option (google.api.http) = { patch: "/v1/posts/{post_id}" body: "*" };
  };
  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/posts/{post_id}" };
  };
  // rpc ReactToPost(ReactToPostRequest) returns (ReactToPostResponse);
}

message Post {
  string post_id = 1;
  string thread_id = 2;
  string parent_post_id = 3;             // для вложенных ответов (1 уровень, родитель сам не может быть ответом)
  boards.v1.Author author = 4;

  string body = 5;                       // markdown. У удалённого поста пустой
  int32 number = 6;                      // порядковый номер в теме (#17), для ссылок
  
  bool deleted = 9;                      // мягкое удаление: ответы под постом остаются

  google.protobuf.Timestamp edited_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message ListPostsRequest {
  string thread_id = 1;
  common.v1.CursorPaginationRequest page = 2;
}

message ListPostsResponse {
  repeated Post posts = 1;
  common.v1.CursorPaginationResponse page = 2;
}

message GetPostRequest {
  string post_id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message CreatePostRequest {
  string thread_id = 1;
  string parent_post_id = 2;
  string body = 3;
}

message CreatePostResponse {
  Post post = 1;
}

message UpdatePostRequest {
  string post_id = 1;
  string body = 2;
}

message UpdatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string post_id = 1;
}

